{% extends 'main/base.html' %}

{% block css %}

<style>
    .card-custom {
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        border-radius: 15px;
        transition: transform 0.3s ease-in-out;
        top: 150px;
       
    }


    .card-body {
        
        border-radius: 0 0 15px 15px;
        background-color: #333;
    }

    .card-title {
        color: wheat;
        font-size: 35px;
        font-weight: 600;
        text-align: center;
        background-color: rgb(64, 167, 5);
    }
    
    .card-title h2{
        color: wheat;
    }

    h6
    {
        text-align: center;
        font-size: 24px;
        color: white;
    }
</style>
{% endblock %}

{% block content %}

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card card-custom">
                    <div class="card-body">
                        <h5 class="card-title">
                            The AI-powered career 
                        </h5>
                        <br>
                        <h6>
                            Job Role 👇
                        </h6>
                        <hr>
                        <h5 class="card-title">
                            {% if data %}        
                        <h6 id="ds" style="color: wheat; font-size: 30px; text-align: center;">{{ data.Role }}</h6>    
                        {% else %}
                         <p>No data available.</p>
                        {% endif %}
                        </h5>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
            let text = document.getElementById("ds").textContent;
            let trimmedText = text.substring(2, text.length -2);
            document.getElementById("ds").textContent = trimmedText;
        
    </script>
    <!-- Bootstrap JS & Dependencies (Optional) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
{% endblock %}
