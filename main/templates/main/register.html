{% extends 'main/base.html' %}

{% block css %}
<style>
.form-group p input{
    font-size:20px;
    text-align: left;
    margin-left: 50px;;
}
.form-group label
{
    margin-left: 100px;
    font-size: 21px;
}
</style>
{% endblock %}

{% block content %}
<div class="container" style="min-height: 100vh; background-color: #f8f9fa;">
    <div class="row justify-content-center align-items-center" style="height: 100vh;">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg">
                <div class="card-header text-center">
                    <h2>Register</h2>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="form-group">
                            {{ form.as_p }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
